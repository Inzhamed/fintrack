# Local development stack.
#
#   docker compose up -d db      # just Postgres, run the API from your IDE / mvnw
#   docker compose up --build    # database, API and web, all in containers
#
# In production the frontend's nginx proxies /api to the API over the compose network,
# so the browser only ever sees one origin and CORS never comes into it.
#
# Copy .env.example to .env first: DB_PASSWORD and JWT_SECRET have no defaults, and both
# the database and the API refuse to start without them.

services:
  db:
    image: postgres:16-alpine
    container_name: fintrack-db
    environment:
      POSTGRES_USER: ${DB_USER:-fintrack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required - see .env.example}
      POSTGRES_DB: ${DB_NAME:-fintrack}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # The API waits on this, so it never races Postgres during startup.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fintrack} -d ${DB_NAME:-fintrack}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: fintrack-redis
    # No persistence: everything Redis holds here is a cache or a rate-limit counter, both
    # of which are safe to lose. Persisting them would only slow restarts down.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for receipt images. A real server rather than LocalStack
  # because this needs one real service, not an emulated AWS - and the same SDK code runs
  # unchanged against real S3, R2 or any other S3 API when the time comes.
  #
  # RustFS replaced MinIO, whose images were withdrawn from Docker Hub and quay.io. The tag
  # is pinned so that a registry change can no longer break a setup that worked yesterday.
  storage:
    image: rustfs/rustfs:1.0.1
    container_name: fintrack-storage
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-fintrack}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required - see .env.example}
    ports:
      - "${STORAGE_PORT:-9000}:9000"
      - "${STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      # A fresh volume, not MinIO's old one: RustFS makes no promise to read MinIO's
      # on-disk format, and these are disposable development receipts.
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    container_name: fintrack-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      # Inside the network the database is reachable by service name, not localhost.
      DATABASE_URL: jdbc:postgresql://db:5432/${DB_NAME:-fintrack}
      DB_USER: ${DB_USER:-fintrack}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-fintrack}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}
      # The browser cannot reach 'storage' - that name only resolves inside the compose
      # network - so presigned URLs must be signed against the host-visible address.
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - see .env.example}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SERVER_PORT: 8080
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    container_name: fintrack-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  db_data:
  rustfs_data:
