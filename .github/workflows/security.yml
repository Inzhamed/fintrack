name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, because a dependency that was clean when it was merged does not stay clean -
    # most vulnerabilities are disclosed long after the version was published.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  images:
    name: Scan container images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to publish findings to the Security tab.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./backend
          - name: web
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t fintrack-${{ matrix.name }}:scan ${{ matrix.context }}

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: fintrack-${{ matrix.name }}:scan
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: HIGH,CRITICAL
          # Report everything; the job fails on the separate exit-code step below, so the
          # SARIF is still uploaded even when findings exist.
          exit-code: '0'

      - name: Upload results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

      - name: Fail on unfixed critical findings
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: fintrack-${{ matrix.name }}:scan
          format: table
          severity: CRITICAL
          # Only findings with a fix available: failing on an unfixable CVE in a base image
          # blocks every build with no action the project can take, and a gate that cannot be
          # satisfied is one that gets switched off.
          ignore-unfixed: true
          exit-code: '1'

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Build the backend
        if: matrix.language == 'java-kotlin'
        working-directory: backend
        run: ./mvnw -B -DskipTests compile

      - name: Analyse
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
