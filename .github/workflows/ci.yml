name: CI

on:
  # Every branch, so work is validated before it ever reaches main.
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A new push supersedes the run already in flight for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. The jobs that need more ask for it explicitly.
permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Docker is available on ubuntu runners, so Testcontainers starts real Postgres,
      # Redis and MinIO here rather than the suite silently degrading to mocks.
      # An explicit `shell: bash` runs the step under pipefail, so a Maven failure still
      # fails the step instead of being masked by tee's own success.
      - name: Build, test and check coverage
        working-directory: backend
        shell: bash
        run: ./mvnw -B verify 2>&1 | tee "$RUNNER_TEMP/maven.log"

      # Reading a run log needs a signed-in account, but annotations are public and show
      # inline on the commit and on every pull request. Publishing Maven's [ERROR] lines as
      # one annotation puts the cause of a red build on the page instead of in a log.
      - name: Surface Maven errors
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/maven.log"
          # An annotation is one line; GitHub turns %0A back into line breaks.
          encode() { cut -c1-300 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{ printf "%s%%0A", $0 }'; }

          errors=$(grep -E '^\[ERROR\]' "$log" \
            | grep -vE '^\[ERROR\] *$|Re-run Maven|-> \[Help|For more information|full stack trace|full debug logging' \
            | head -40 | encode)
          echo "::error title=Maven build failed::${errors:-No [ERROR] lines found - see the run log}"

          # A context that fails to start gives its real reason only in Spring Boot's failure
          # analysis and in the exception chain - neither of which carries an [ERROR] prefix.
          cause=$( { grep -A 12 'APPLICATION FAILED TO START' "$log" | head -14
                     grep -E '^Caused by: ' "$log" | awk '!seen[$0]++' | tail -6; } | awk 'NF == 0 || !seen[$0]++' | encode)
          if [ -n "$cause" ]; then echo "::error title=Root cause::${cause}"; fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          retention-days: 7

      # Only on failure: the reports are large and uninteresting when everything passed.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # tsc runs as part of the build, so a type error fails here rather than at runtime.
      - name: Type-check and build
        working-directory: frontend
        run: npm run build

      - name: Unit tests
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # No point driving a browser through a build that is already broken.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start dependencies
        run: |
          docker compose up -d db redis storage
        env:
          DB_PASSWORD: ci-postgres
          STORAGE_SECRET_KEY: ci-storage-secret

      - name: Wait for dependencies
        run: |
          for i in $(seq 1 60); do
            if docker exec fintrack-db pg_isready -U fintrack -d fintrack >/dev/null 2>&1 \
               && docker exec fintrack-redis redis-cli ping >/dev/null 2>&1; then
              echo "dependencies ready"; exit 0
            fi
            sleep 2
          done
          echo "dependencies did not become ready"; docker compose logs; exit 1

      - name: Build the API
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      - name: Start the API
        working-directory: backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/fintrack
          DB_USER: fintrack
          DB_PASSWORD: ci-postgres
          REDIS_HOST: localhost
          STORAGE_ENDPOINT: http://localhost:9000
          STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
          STORAGE_ACCESS_KEY: fintrack
          STORAGE_SECRET_KEY: ci-storage-secret
          JWT_SECRET: Y2ktb25seS1zZWNyZXQtbmV2ZXItdXNlZC1hbnl3aGVyZS1lbHNlLTAxMjM0NTY3
          # The suite drives dozens of sign-ins from one address in under a minute and would
          # otherwise be throttled by the very protection it exists to test around.
          RATELIMIT_REGISTER_LIMIT: '1000'
          RATELIMIT_LOGIN_LIMIT: '1000'
        run: |
          nohup java -jar target/*.jar > api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health >/dev/null; then
              echo "api ready"; exit 0
            fi
            sleep 2
          done
          echo "api did not start"; cat api.log; exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Upload API log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-api-log
          path: backend/api.log
          retention-days: 7
