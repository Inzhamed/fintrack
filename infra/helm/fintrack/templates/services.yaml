apiVersion: v1
kind: Service
metadata:
  name: {{ include "fintrack.fullname" . }}-api
  labels:
    {{- include "fintrack.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.api.name }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.api.port }}
      targetPort: http
      name: http
  selector:
    {{- include "fintrack.selectorLabels" (dict "root" . "component" .Values.api.name) | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fintrack.fullname" . }}-web
  labels:
    {{- include "fintrack.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.web.name }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.web.port }}
      targetPort: http
      name: http
  selector:
    {{- include "fintrack.selectorLabels" (dict "root" . "component" .Values.web.name) | nindent 4 }}
