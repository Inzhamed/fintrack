{{- if not .Values.secrets.existingSecret }}
{{/*
Created only when the operator has not supplied their own Secret.

Values passed with --set land in the release's stored manifest, so for anything beyond a
local cluster the right move is to create the Secret out of band and set
secrets.existingSecret. The chart is written so that path needs no template changes.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fintrack.fullname" . }}-secrets
  labels:
    {{- include "fintrack.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.secrets.dbPassword }}
  {{- fail "secrets.dbPassword is required: set it, or point secrets.existingSecret at a Secret you created" }}
  {{- end }}
  {{- if not .Values.secrets.jwtSecret }}
  {{- fail "secrets.jwtSecret is required: generate one with `openssl rand -base64 48`" }}
  {{- end }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  STORAGE_ACCESS_KEY: {{ .Values.secrets.storageAccessKey | quote }}
  STORAGE_SECRET_KEY: {{ required "secrets.storageSecretKey is required" .Values.secrets.storageSecretKey | quote }}
{{- end }}
