{{- if .Values.serviceAccount.create }}
{{/*
A dedicated identity rather than the namespace default.

Nothing here calls the Kubernetes API, so no RBAC is bound to it and the token is not
mounted - which is the point: an identity with no permissions and no token is one less thing
for a compromised pod to use.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fintrack.serviceAccountName" . }}
  labels:
    {{- include "fintrack.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
