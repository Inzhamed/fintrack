# Base configuration. Every secret is read from the environment with no default,
# so the application refuses to boot rather than silently running on a well-known
# credential. `docker compose up` supplies these from the root .env file.

spring:
  application:
    name: fintrack-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fintrack}
    username: ${DB_USER:fintrack}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks that the entity mappings agree
      # with the migrated database and refuses to start if they have drifted apart.
      ddl-auto: validate
    open-in-view: false          # No lazy loading during view rendering. Fail loudly instead.
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # This project starts from an empty database, so baselining is never needed.
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Fail fast rather than hanging a request thread on an unreachable cache. Both the
      # cache and the rate limiter degrade gracefully when Redis is down.
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2

  cache:
    type: redis

  servlet:
    multipart:
      # Slightly above the 5 MB the service enforces, so the service produces the
      # error message rather than the container rejecting it with a bare 500.
      max-file-size: 6MB
      max-request-size: 6MB

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true   # Reject typo'd request fields instead of ignoring them

server:
  port: ${SERVER_PORT:8080}
  error:
    # Errors are produced by the @RestControllerAdvice, never by the servlet container's
    # default page, which would leak a stack trace and a different JSON shape.
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

fintrack:
  storage:
    enabled: ${STORAGE_ENABLED:true}
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    # Presigned URLs are signed against this, since the browser cannot resolve a
    # container hostname and the signature covers the host.
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
    bucket: ${STORAGE_BUCKET:fintrack-receipts}
    access-key: ${STORAGE_ACCESS_KEY:fintrack}
    secret-key: ${STORAGE_SECRET_KEY}

  cache:
    # Turned off in tests that assert on uncached behaviour.
    enabled: ${CACHE_ENABLED:true}

  security:
    jwt:
      # HS256 signing key, base64-encoded, minimum 256 bits. Generate with:
      #   openssl rand -base64 48
      secret: ${JWT_SECRET}
      issuer: fintrack
      access-token-ttl: PT15M      # Short-lived: a stolen access token expires fast.
      refresh-token-ttl: P30D      # Long-lived but revocable, hashed, and rotated on use.
    ratelimit:
      # Production defaults. Raised by the E2E profile, which drives dozens of sign-ins
      # from one address in under a minute.
      login:
        limit: ${RATELIMIT_LOGIN_LIMIT:10}
        window: ${RATELIMIT_LOGIN_WINDOW:PT15M}
      register:
        limit: ${RATELIMIT_REGISTER_LIMIT:5}
        window: ${RATELIMIT_REGISTER_WINDOW:PT1H}

    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        # Kubernetes needs health; Phase 5 adds prometheus. Nothing else is public.
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true            # /actuator/health/{liveness,readiness} for k8s probes
      show-details: never

logging:
  level:
    org.flywaydb: INFO
